name: Linux ARM64

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-arm64-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # Ubuntu 22.04 uses glibc 2.35, compatible with 64-bit Raspberry Pi OS
    # Bookworm (2.36) and Trixie (2.41). Not for 32-bit Raspberry Pi OS.
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libudev-dev
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-arm64-minimal
      - name: Test core and server on Linux
        run: cargo test --locked -p printa-ble-core -p printa-ble --no-default-features
      - name: Build the ARM64 binary
        run: cargo build --locked --release -p printa-ble --no-default-features
      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          target/release/printable --help
          mkdir -p dist/package
          install -m 755 target/release/printable dist/package/printable
          printf '%s\n' "$GITHUB_SHA" > dist/package/COMMIT
          ldd target/release/printable > dist/package/LIBRARIES.txt
          printf '%s\n' 'aarch64 Linux; glibc >= 2.35; runtime libdbus-1-3; no URL-printing or CJK features' > dist/package/BUILD.txt
          (cd dist/package && sha256sum printable > SHA256SUMS)
          tar -czf dist/printable-linux-arm64.tar.gz -C dist/package .
          (cd dist && sha256sum printable-linux-arm64.tar.gz > printable-linux-arm64.tar.gz.sha256)
      - uses: actions/upload-artifact@v7
        with:
          name: printable-linux-arm64-${{ github.sha }}
          path: |
            dist/printable-linux-arm64.tar.gz
            dist/printable-linux-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
