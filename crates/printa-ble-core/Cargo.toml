[package]
name = "printa-ble-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = ["cjk"]
# Bundles Noto Sans JP as a per-glyph fallback face so CJK text renders
# instead of tofu. Costs ~4.5 MB of binary size. Kept on for every target,
# WASM included, so a document prints the same from the browser as from the
# CLI; turn it off only when that does not matter and the bytes do.
cjk = []

[dependencies]
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
fontdue = "0.9"
pulldown-cmark = { version = "0.12", default-features = false }
qrcode = { version = "0.14", default-features = false }
barcoders = { version = "2", default-features = false }
