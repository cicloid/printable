[package]
name = "printa-ble-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# On by default so the browser renders what the CLI renders. Passed through so
# `--no-default-features` on this crate actually reaches the core feature and
# drops the 4.5 MB face from the bundle.
default = ["cjk"]
cjk = ["printa-ble-core/cjk"]

[dependencies]
printa-ble-core = { path = "../printa-ble-core", default-features = false }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_bytes = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
