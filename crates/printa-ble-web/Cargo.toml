[package]
name = "printa-ble-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WASM build of printa-ble-core: render and print to Bluetooth thermal printers from the browser via Web Bluetooth"
keywords = ["thermal-printer", "bluetooth", "wasm", "web-bluetooth", "cat-printer"]
categories = ["wasm", "hardware-support"]
readme = "../../README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# On by default so the browser renders what the CLI renders. Passed through so
# `--no-default-features` on this crate actually reaches the core feature and
# drops the 4.5 MB face from the bundle.
default = ["cjk"]
cjk = ["printa-ble-core/cjk"]

[dependencies]
printa-ble-core = { version = "0.1.0", path = "../printa-ble-core", default-features = false }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_bytes = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
