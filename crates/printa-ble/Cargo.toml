[package]
name = "printa-ble"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Print text, images, markdown, and web pages to LX-D02 and X6 cat-printer Bluetooth thermal printers (installs the `printable` binary)"
keywords = ["thermal-printer", "bluetooth", "ble", "cat-printer", "printing"]
categories = ["command-line-utilities", "hardware-support"]
readme = "../../README.md"

[[bin]]
name = "printable"
path = "src/main.rs"

[features]
default = ["url", "cjk"]
url = ["dep:chromiumoxide"]
# Passed through from `printa-ble-core` so a binary build can actually drop the
# 4.5 MB CJK face: `--no-default-features --features url`.
cjk = ["printa-ble-core/cjk"]

[dependencies]
printa-ble-core = { version = "0.1.0", path = "../printa-ble-core", default-features = false }
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"], optional = true }
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
btleplug = "0.11"
futures = "0.3"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi", "std"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
