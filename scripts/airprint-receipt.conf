# Printer attributes for `ippeveprinter -a` describing the LX-D02 as what it
# actually is: a 48 mm continuous-roll thermal printer, not a sheet printer.
#
# Without this the client lays a document out for US Letter, and 5100 px of
# page has to be squeezed onto 384 px of paper — a 13x reduction that turns
# body text into grey mush. Declaring the real geometry makes the client
# rasterise straight to our bitmap width instead.
#
# Syntax is the ipptool attributes-file format. Dimensions are hundredths of a
# millimetre (US Letter is 21590 x 27940), so 48 mm is 4800.
#
# NOTE: `-a` cannot be combined with `-f`, so the supported formats are
# declared here rather than on the command line.

# NOTE: document-format-supported is deliberately NOT set here.
#
# ippeveprinter appends its own defaults after this file, so declaring it
# produces a duplicate attribute in every Get-Printer-Attributes response,
# which ipptool flags as a conformance error. `-f` would restrict the formats
# properly but cannot be combined with `-a`.
#
# The default set it advertises is application/octet-stream, image/urf and
# image/pwg-raster. Only URF is actually decodable here; a client that picked
# PWG Raster would get a clear error rather than a wrong print. In practice
# iOS keys off the URF entry in the DNS-SD TXT record and picks image/urf,
# which is what we observe on the wire. Not advertising PDF at all remains
# deliberate: it is what makes the client rasterise, so this project needs no
# PDF renderer.

# 203 dpi is the print head's native resolution. 48 mm at 203 dpi is 383.6
# dots, i.e. the 384-dot line the hardware actually prints, so a page
# rasterised at this resolution needs no rescaling at all.
ATTR resolution printer-resolution-default 203dpi
ATTR resolution printer-resolution-supported 203dpi

# The URF key is what tells an AirPrint client how to rasterise:
#   RS203  raster at 203 dpi          W8   8-bit greyscale
#   CP1    one copy                   IS1  one input slot
#   MT1    one media type             V1.4 URF version
ATTR keyword urf-supported CP1,IS1,MT1,RS203,V1.4,W8

# Continuous roll. The named size is what most clients will pick; the
# custom_min/custom_max pair is what makes a variable-length job legal, so a
# short receipt does not get padded out to a fixed page.
# US Letter and A4 are listed as well, and deliberately not as the default.
# Nothing about this printer wants a sheet size, but macOS's own CUPS filter
# chain lays out badly on a 48 mm page — `texttopdf` clips at the right edge
# and `imagetopdf` emits a blank page — so `lp` needs an escape hatch:
#   lp -d printable -o media=na_letter_8.5x11in file.pdf
# The decoder copes with either: a receipt-width page keeps its layout, a
# sheet-size page is cropped to its ink. iOS rasterises the document itself
# and never touches those filters, so it gets the 48 mm default and the good
# path.
ATTR keyword media-supported om_receipt_48x297mm,custom_min_48x25mm,custom_max_48x1000mm,na_letter_8.5x11in,iso_a4_210x297mm
ATTR keyword media-default om_receipt_48x297mm
ATTR keyword media-ready om_receipt_48x297mm
ATTR keyword media-type-supported labels
ATTR keyword media-source-supported main-roll

# 48 mm wide. The length here must be a plain integer, NOT a rangeOfInteger:
# a range makes `lpadmin -m everywhere` fail with "Unable to create PPD file",
# because a PPD cannot express a variable page length. Continuous paper is
# declared by the custom_min/custom_max keywords in media-supported above,
# which is the IPP Everywhere way to say it and costs nothing here.
ATTR collection media-size-supported {
	MEMBER integer x-dimension 4800
	MEMBER integer y-dimension 29700
}

# Edge-to-edge. Any margin here is paper the printer physically cannot use,
# and this printer has none: all 384 dots are addressable.
ATTR integer media-bottom-margin-supported 0
ATTR integer media-left-margin-supported 0
ATTR integer media-right-margin-supported 0
ATTR integer media-top-margin-supported 0

# media-col-supported is likewise left to ippeveprinter: its default is already
# exactly this list, and declaring it only duplicates the attribute.

ATTR collection media-col-default {
	MEMBER collection media-size {
		MEMBER integer x-dimension 4800
		MEMBER integer y-dimension 29700
	}
	MEMBER keyword media-size-name om_receipt_48x297mm
	MEMBER keyword media-source main-roll
	MEMBER keyword media-type labels
	MEMBER integer media-bottom-margin 0
	MEMBER integer media-left-margin 0
	MEMBER integer media-right-margin 0
	MEMBER integer media-top-margin 0
}

ATTR collection media-col-ready {
	MEMBER collection media-size {
		MEMBER integer x-dimension 4800
		MEMBER integer y-dimension 29700
	}
	MEMBER keyword media-size-name om_receipt_48x297mm
	MEMBER keyword media-source main-roll
	MEMBER keyword media-type labels
	MEMBER integer media-bottom-margin 0
	MEMBER integer media-left-margin 0
	MEMBER integer media-right-margin 0
	MEMBER integer media-top-margin 0
}

# Monochrome, single-sided, one copy: say so rather than letting a client
# offer options the hardware cannot honour.
ATTR keyword print-color-mode-supported monochrome
ATTR keyword print-color-mode-default monochrome
ATTR keyword sides-supported one-sided
ATTR keyword sides-default one-sided
ATTR boolean color-supported false
